- name: Create EC2 instance and Route53 record
  hosts: all
  connection: local
  vars: 
   sg_id: "sg-0e17db6ab1dfaa76a"
   ami_id: "ami-0220d79f3f480ecf5"
   env: dev
   domain: "rakesh.bond"
   instances:
    - mongodb
    - catalogue
    - frontend
  tasks:
  - name: EC2 instance creation
    amazon.aws.ec2_instance:
      name: "{{ item }}-{{ env }}" #mongodb-dev
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
       Project: "roboshop"
       Component: "{{ item }}"
       Environment: "{{ env }}"
       Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: Create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain }}"
      record: "{{ item.item }}-{{ env }}.{{ domain }}" #mongodb-dev.rakesh.bond
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"
  
  - name: Create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain }}"
      record: "roboshop-{{ env }}.{{ domain }}" #roboshop-dev.rakesh.bond
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"
    
        