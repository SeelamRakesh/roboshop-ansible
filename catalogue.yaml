- name: Configuring catalogue
  hosts: catalogue
  become: yes
  vars:
   MONGODB_HOST: "mongodb.rakesh.bond"
  tasks:
  - name: Disabling default Nodejs version
    ansible.builtin.command: dnf module disable nodejs -y
  
  - name: Enabling Nodejs version-20
    ansible.builtin.command: dnf module enable nodejs:20 -y
  
  - name: Install Nodesjs
    ansible.builtin.package:
      name: nodejs
      state: present 
  
  - name: Create roboshop system user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  
  - name: Create a app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download a Catalogue code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
  
  - name: Extract catalogue code
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  
  - name: Install dependencies
    community.general.npm:
      path: /app
      state: present
  
  - name: Copying Catalogue service
    ansible.builtin.copy:
     src: catalogue.service
     dest: /etc/systemd/system/catalogue.service
  
  - name: Reload Daemon
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Start and Enable Catalogue
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: true

  - name: Copying mongo repo
    ansible.builtin.copy:
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo
  
  - name: Install mongodb
    ansible.builtin.package:
      name: mongodb-mongosh
      state: present
  
  - name: Check data loaded or not
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output
    ignore_errors: true

  - name: Printing output
    ansible.builtin.debug:
     msg: "{{ catalogue_output }}" 
  
  - name: Load Master data
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    #when: catalogue_output.stdout | int < 0 
    
  - name: start catalogue
    ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: yes
